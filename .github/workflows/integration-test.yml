name: Integration Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Create dummy coverage file
        run: echo "total_statements=100\ntotal_misses=20\n" > coverage.txt

      - name: Install dependencies
        run: npm install

      - name: Build action
        run: npm run build

      - name: Run the action
        uses: ./
        with:
          prometheus_endpoint: 'http://localhost:9091'
          labels: 'branch=integration-test'

      - name: Verify the action ran
        run: echo "Integration test ran successfully"
